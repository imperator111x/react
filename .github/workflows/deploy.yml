name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          # Öffentliche Supabase-Keys (werden ohnehin im Frontend-Bundle sichtbar)
          VITE_SUPABASE_URL: https://umynsbrfthlsqzkehqtm.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVteW5zYnJmdGhsc3F6a2VocXRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyOTAyODIsImV4cCI6MjEwMzg2NjI4Mn0.XKPrdqTcXrMuYkIuD2B-0Znq7pgBP_TbG9f-mKdnqVc

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
